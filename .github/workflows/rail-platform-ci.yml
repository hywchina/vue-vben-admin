name: Rail platform quality gates

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: rail-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TZ: Asia/Shanghai

jobs:
  quality:
    name: Static checks, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - run: pnpm lint
      - run: pnpm typecheck:rail
      - run: pnpm test:rail
      - run: pnpm build:rail

  integration:
    name: PostgreSQL, MinIO and API integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_PUBLIC_URL: http://localhost:5666
      BOOTSTRAP_DEMO_USERS: true
      CORS_ALLOWED_ORIGINS: http://localhost:5666
      DATABASE_URL: postgresql://rail_platform:rail_platform_dev@localhost:5432/rail_platform
      JWT_SECRET: development-only-ci-integration-secret
      NODE_ENV: development
      S3_ACCESS_KEY: rail-ci-minio
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - name: Configure disposable object storage credentials
        run: |
          node --input-type=module <<'JS'
          import { randomUUID } from 'node:crypto';
          import { appendFileSync, writeFileSync } from 'node:fs';
          const secret = randomUUID() + randomUUID();
          appendFileSync(process.env.GITHUB_ENV, `S3_SECRET_KEY=${secret}\n`);
          writeFileSync('deploy/rail-platform/.env.minio.local', `MINIO_ROOT_USER=${process.env.S3_ACCESS_KEY}\nMINIO_ROOT_PASSWORD=${secret}\n`, { mode: 0o600 });
          JS
      - name: Start infrastructure
        run: pnpm infra:rail:up
      - name: Run integration acceptance
        run: pnpm test:rail:integration
      - name: Diagnostics
        if: failure()
        run: |
          docker compose -f deploy/rail-platform/compose.yaml logs || true
      - name: Stop infrastructure
        if: always()
        run: |
          pnpm infra:rail:down
