name: 缺陷报告
description: 报告轨道客室智能设计平台中的可复现问题
title: '[Bug] '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 说明实际行为、预期行为和影响范围。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 提供最短可复现步骤，不要粘贴密码、令牌或业务敏感数据。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 分支、提交、操作系统、浏览器和部署方式。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志或截图
      description: 请先脱敏；不要提交完整请求体、聊天正文或文件正文。
