name: 需求建议
description: 提议轨道客室智能设计平台的产品或工程改进
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 说明角色、项目范围和要解决的问题。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明正常路径、失败路径、数据来源和外部依赖。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 给出可验证的结果与权限边界。
    validations:
      required: true
