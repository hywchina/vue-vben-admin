name: ${PLATFORM_PROJECT_NAME:-rail-platform-validation}

services:
  platform:
    image: ${PLATFORM_IMAGE:-rail-platform:single-image}
    build:
      context: ../..
      dockerfile: deploy/single-image/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-m.daocloud.io/docker.io/library/node:24.16.0-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        BUILD_NODE_OPTIONS: ${BUILD_NODE_OPTIONS:---max-old-space-size=8192}
    env_file:
      - ${PLATFORM_CONFIG_FILE:-./config.env}
    environment:
      DATABASE_URL: postgresql://rail_platform:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@postgres:5432/rail_platform
      S3_ENDPOINT: http://minio:9000
      S3_CORS_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      NODE_OPTIONS: ${PLATFORM_NODE_OPTIONS:---max-old-space-size=2048}
      NITRO_HOST: 127.0.0.1
      NITRO_PORT: '5320'
      NODE_ENV: production
    ports:
      - '${PLATFORM_BIND_IP:-127.0.0.1}:${PLATFORM_PORT:-18080}:8080'
    cpus: ${PLATFORM_CPUS:-4}
    mem_limit: ${PLATFORM_MEMORY:-6g}
    stop_grace_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE:-m.daocloud.io/docker.io/library/postgres:17.6-alpine}
    environment:
      POSTGRES_DB: rail_platform
      POSTGRES_USER: rail_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-15432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U rail_platform -d rail_platform]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Configure S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Configure S3_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ALLOWED_ORIGINS}
    ports:
      - '${PLATFORM_BIND_IP:-127.0.0.1}:${S3_PORT:-19100}:9000'
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  mailpit:
    image: ${MAILPIT_IMAGE:-m.daocloud.io/docker.io/axllent/mailpit:v1.30.0}
    ports:
      - '127.0.0.1:${SMTP_HOST_PORT:-11025}:1025'
      - '127.0.0.1:${MAILPIT_WEB_PORT:-18025}:8025'
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
