<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F4F6F8"/><path d="M0 0H1600V9H0Z" fill="#C91838"/><text x="70" y="66" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" letter-spacing="3" fill="#E64A68">PROBLEM</text><text x="70" y="124" font-family="Noto Sans CJK SC, sans-serif" font-size="48" fill="#17212B" font-weight="700" text-anchor="start"><tspan x="70" dy="0">为什么需要统一设计平台</tspan></text><text x="72" y="163" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#667085" font-weight="400" text-anchor="start"><tspan x="72" dy="0">AI 能力越来越多，但真正的设计工作不能停留在“逐个工具调用”。</tspan></text><text x="1518" y="844" font-family="Noto Sans CJK SC" font-size="15" fill="#667085" text-anchor="end">02 / 20</text><text x="70" y="844" font-family="Noto Sans CJK SC" font-size="13" fill="#667085">轨道客室智能设计平台 · 项目介绍</text><rect x="70" y="220" width="1460" height="500" rx="28" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="1"/><circle cx="235" cy="330" r="30" fill="#FCECEF" stroke="none" stroke-width="1"/><text x="235" y="338" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#C91838" font-weight="700" text-anchor="middle"><tspan x="235" dy="0">1</tspan></text><text x="235" y="400" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#17212B" font-weight="650" text-anchor="middle"><tspan x="235" dy="0">能力入口分散</tspan></text><text x="235" y="444" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#667085" font-weight="400" text-anchor="middle"><tspan x="235" dy="0">切换页面与上下文</tspan></text><circle cx="595" cy="330" r="30" fill="#FCECEF" stroke="none" stroke-width="1"/><text x="595" y="338" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#C91838" font-weight="700" text-anchor="middle"><tspan x="595" dy="0">2</tspan></text><text x="595" y="400" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#17212B" font-weight="650" text-anchor="middle"><tspan x="595" dy="0">素材重复上传</tspan></text><text x="595" y="444" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#667085" font-weight="400" text-anchor="middle"><tspan x="595" dy="0">同一图片反复选择</tspan></text><circle cx="955" cy="330" r="30" fill="#FCECEF" stroke="none" stroke-width="1"/><text x="955" y="338" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#C91838" font-weight="700" text-anchor="middle"><tspan x="955" dy="0">3</tspan></text><text x="955" y="400" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#17212B" font-weight="650" text-anchor="middle"><tspan x="955" dy="0">结果难以复用</tspan></text><text x="955" y="444" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#667085" font-weight="400" text-anchor="middle"><tspan x="955" dy="0">输出缺少资产身份</tspan></text><circle cx="1315" cy="330" r="30" fill="#FCECEF" stroke="none" stroke-width="1"/><text x="1315" y="338" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#C91838" font-weight="700" text-anchor="middle"><tspan x="1315" dy="0">4</tspan></text><text x="1315" y="400" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#17212B" font-weight="650" text-anchor="middle"><tspan x="1315" dy="0">任务状态割裂</tspan></text><text x="1315" y="444" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#667085" font-weight="400" text-anchor="middle"><tspan x="1315" dy="0">失败与进度不可追踪</tspan></text><line x1="235" y1="530" x2="1315" y2="530" stroke="#E7A5B2" stroke-width="4" stroke-dasharray="8 10"/><rect x="606" y="575" width="210" height="36" rx="18" fill="#C91838" stroke="none" stroke-width="1"/><text x="711" y="600" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#FFFFFF" font-weight="600" text-anchor="middle"><tspan x="711" dy="0">统一项目上下文</tspan></text><text x="800" y="653" font-family="Noto Sans CJK SC, sans-serif" font-size="24" fill="#344054" font-weight="600" text-anchor="middle"><tspan x="800" dy="0">把人、项目、输入、任务、输出和审计连接成一条可追溯业务链</tspan></text></svg>