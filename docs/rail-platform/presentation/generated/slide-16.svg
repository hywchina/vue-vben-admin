<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F4F6F8"/><path d="M0 0H1600V9H0Z" fill="#C91838"/><text x="70" y="66" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" letter-spacing="3" fill="#E64A68">COLLABORATION</text><text x="70" y="124" font-family="Noto Sans CJK SC, sans-serif" font-size="48" fill="#17212B" font-weight="700" text-anchor="start"><tspan x="70" dy="0">团队协作与数据边界</tspan></text><text x="72" y="163" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#667085" font-weight="400" text-anchor="start"><tspan x="72" dy="0">项目成员共享业务成果，但用户私有会话和权限边界仍由后端强制校验。</tspan></text><text x="1518" y="844" font-family="Noto Sans CJK SC" font-size="15" fill="#667085" text-anchor="end">16 / 20</text><text x="70" y="844" font-family="Noto Sans CJK SC" font-size="13" fill="#667085">轨道客室智能设计平台 · 项目介绍</text><rect x="80" y="220" width="680" height="510" rx="28" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="1"/><text x="120" y="275" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#17212B" font-weight="700" text-anchor="start"><tspan x="120" dy="0">项目协作</tspan></text><circle cx="220" cy="390" r="44" fill="#C91838" stroke="none" stroke-width="1"/><text x="220" y="398" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="220" dy="0">创</tspan></text><circle cx="420" cy="390" r="44" fill="#FCECEF" stroke="none" stroke-width="1"/><text x="420" y="398" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#C91838" font-weight="700" text-anchor="middle"><tspan x="420" dy="0">编</tspan></text><circle cx="620" cy="390" r="44" fill="#EEF1F4" stroke="none" stroke-width="1"/><text x="620" y="398" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#667085" font-weight="700" text-anchor="middle"><tspan x="620" dy="0">读</tspan></text><text x="220" y="465" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#17212B" font-weight="650" text-anchor="middle"><tspan x="220" dy="0">创建者</tspan></text><text x="420" y="465" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#17212B" font-weight="650" text-anchor="middle"><tspan x="420" dy="0">编辑成员</tspan></text><text x="620" y="465" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#17212B" font-weight="650" text-anchor="middle"><tspan x="620" dy="0">只读成员</tspan></text><line x1="265" y1="390" x2="375" y2="390" stroke="#D9E0E7" stroke-width="3" stroke-dasharray="7 7"/><line x1="465" y1="390" x2="575" y2="390" stroke="#D9E0E7" stroke-width="3" stroke-dasharray="7 7"/><text x="120" y="550" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#667085" font-weight="500" text-anchor="start"><tspan x="120" dy="0">按 USR-* 邀请 · 成员贡献可筛选 · 移除不删除历史业务数据</tspan></text><rect x="800" y="220" width="720" height="510" rx="28" fill="#202831" stroke="none" stroke-width="1"/><text x="845" y="275" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="845" dy="0">不可越过的边界</tspan></text><circle cx="865" cy="350" r="16" fill="#3A4651" stroke="none" stroke-width="1"/><text x="865" y="357" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#FFB7C5" font-weight="800" text-anchor="middle"><tspan x="865" dy="0">✓</tspan></text><text x="900" y="357" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#E6EBF0" font-weight="500" text-anchor="start"><tspan x="900" dy="0">普通用户仅访问参与项目</tspan></text><circle cx="865" cy="425" r="16" fill="#3A4651" stroke="none" stroke-width="1"/><text x="865" y="432" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#FFB7C5" font-weight="800" text-anchor="middle"><tspan x="865" dy="0">✓</tspan></text><text x="900" y="432" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#E6EBF0" font-weight="500" text-anchor="start"><tspan x="900" dy="0">管理员权限不等于读取他人 AI 正文</tspan></text><circle cx="865" cy="500" r="16" fill="#3A4651" stroke="none" stroke-width="1"/><text x="865" y="507" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#FFB7C5" font-weight="800" text-anchor="middle"><tspan x="865" dy="0">✓</tspan></text><text x="900" y="507" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#E6EBF0" font-weight="500" text-anchor="start"><tspan x="900" dy="0">资产和任务查询强制项目范围</tspan></text><circle cx="865" cy="575" r="16" fill="#3A4651" stroke="none" stroke-width="1"/><text x="865" y="582" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#FFB7C5" font-weight="800" text-anchor="middle"><tspan x="865" dy="0">✓</tspan></text><text x="900" y="582" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#E6EBF0" font-weight="500" text-anchor="start"><tspan x="900" dy="0">关键动作记录审计元数据</tspan></text></svg>