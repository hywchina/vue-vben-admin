<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#202831"/><path d="M0 0H1600V9H0Z" fill="#C91838"/><text x="70" y="66" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" letter-spacing="3" fill="#E64A68">SUMMARY</text><text x="70" y="124" font-family="Noto Sans CJK SC, sans-serif" font-size="48" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="70" dy="0">让 AI 能力真正进入设计业务</tspan></text><text x="1518" y="844" font-family="Noto Sans CJK SC" font-size="15" fill="#C7D0D9" text-anchor="end">20 / 20</text><text x="70" y="844" font-family="Noto Sans CJK SC" font-size="13" fill="#C7D0D9">轨道客室智能设计平台 · 项目介绍</text><text x="80" y="205" font-family="Noto Sans CJK SC, sans-serif" font-size="28" fill="#E6EBF0" font-weight="500" text-anchor="start"><tspan x="80" dy="0">平台的价值不在于“拥有多少模型”，而在于把每次输入、生成、验证和复用组织起来。</tspan></text><rect x="80" y="330" width="330" height="180" rx="24" fill="#2C3540" stroke="#46515D" stroke-width="1"/><text x="112" y="390" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#FF9DB0" font-weight="800" text-anchor="start"><tspan x="112" dy="0">01</tspan></text><text x="112" y="448" font-family="Noto Sans CJK SC, sans-serif" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="112" dy="0">项目是数据边界</tspan></text><text x="112" y="485" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#B9C2CC" font-weight="400" text-anchor="start"><tspan x="112" dy="0">人、资产、任务受控共享</tspan></text><rect x="450" y="330" width="330" height="180" rx="24" fill="#2C3540" stroke="#46515D" stroke-width="1"/><text x="482" y="390" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#FF9DB0" font-weight="800" text-anchor="start"><tspan x="482" dy="0">02</tspan></text><text x="482" y="448" font-family="Noto Sans CJK SC, sans-serif" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="482" dy="0">会话是设计上下文</tspan></text><text x="482" y="485" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#B9C2CC" font-weight="400" text-anchor="start"><tspan x="482" dy="0">多轮组合 18 项能力</tspan></text><rect x="820" y="330" width="330" height="180" rx="24" fill="#2C3540" stroke="#46515D" stroke-width="1"/><text x="852" y="390" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#FF9DB0" font-weight="800" text-anchor="start"><tspan x="852" dy="0">03</tspan></text><text x="852" y="448" font-family="Noto Sans CJK SC, sans-serif" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="852" dy="0">资产是交换协议</tspan></text><text x="852" y="485" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#B9C2CC" font-weight="400" text-anchor="start"><tspan x="852" dy="0">结果确认后才能跨能力复用</tspan></text><rect x="1190" y="330" width="330" height="180" rx="24" fill="#C91838" stroke="none" stroke-width="1"/><text x="1222" y="390" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#FFD7DF" font-weight="800" text-anchor="start"><tspan x="1222" dy="0">04</tspan></text><text x="1222" y="448" font-family="Noto Sans CJK SC, sans-serif" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="1222" dy="0">任务是执行台账</tspan></text><text x="1222" y="485" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#FFE7EC" font-weight="400" text-anchor="start"><tspan x="1222" dy="0">状态、进度、错误可追溯</tspan></text><text x="80" y="650" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#FF9DB0" font-weight="700" text-anchor="start"><tspan x="80" dy="0">下一阶段</tspan></text><text x="80" y="700" font-family="Noto Sans CJK SC, sans-serif" font-size="24" fill="#FFFFFF" font-weight="550" text-anchor="start"><tspan x="80" dy="0">真实 GPU 长任务验收  ·  更多企业能力适配  ·  试运行与备份恢复演练</tspan></text><rect x="80" y="758" width="310" height="36" rx="18" fill="#C91838" stroke="none" stroke-width="1"/><text x="235" y="783" font-family="Noto Sans CJK SC, 