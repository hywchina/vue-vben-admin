<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F4F6F8"/><path d="M0 0H1600V9H0Z" fill="#C91838"/><text x="70" y="66" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" letter-spacing="3" fill="#E64A68">UNIFIED INPUT</text><text x="70" y="124" font-family="Noto Sans CJK SC, sans-serif" font-size="48" fill="#17212B" font-weight="700" text-anchor="start"><tspan x="70" dy="0">统一输入：文本、资产与参数合一</tspan></text><text x="72" y="163" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#667085" font-weight="400" text-anchor="start"><tspan x="72" dy="0">用户不再在多个页面之间搬运数据；输入、能力和快捷参数集中在同一个输入器。</tspan></text><text x="1518" y="844" font-family="Noto Sans CJK SC" font-size="15" fill="#667085" text-anchor="end">07 / 20</text><text x="70" y="844" font-family="Noto Sans CJK SC" font-size="13" fill="#667085">轨道客室智能设计平台 · 项目介绍</text><rect x="120" y="260" width="1360" height="300" rx="34" fill="#FFFFFF" stroke="#F0A7B5" stroke-width="3"/><text x="170" y="330" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#667085" font-weight="400" text-anchor="start"><tspan x="170" dy="0">描述你的设计需求…</tspan></text><line x1="160" y1="390" x2="1440" y2="390" stroke="#D9E0E7" stroke-width="2" /><rect x="170" y="430" width="140" height="36" rx="18" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="240" y="455" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#17212B" font-weight="600" text-anchor="middle"><tspan x="240" dy="0">＋ 添加素材</tspan></text><rect x="328" y="430" width="120" height="36" rx="18" fill="#FCECEF" stroke="none" stroke-width="1"/><text x="388" y="455" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#C91838" font-weight="600" text-anchor="middle"><tspan x="388" dy="0">文生图 ×</tspan></text><rect x="466" y="430" width="92" height="36" rx="18" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="512" y="455" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#17212B" font-weight="600" text-anchor="middle"><tspan x="512" dy="0">模型</tspan></text><rect x="576" y="430" width="130" height="36" rx="18" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="641" y="455" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#17212B" font-weight="600" text-anchor="middle"><tspan x="641" dy="0">比例 16:9</tspan></text><rect x="724" y="430" width="92" height="36" rx="18" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="770" y="455" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#17212B" font-weight="600" text-anchor="middle"><tspan x="770" dy="0">风格</tspan></text><rect x="834" y="430" width="92" height="36" rx="18" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="880" y="455" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#17212B" font-weight="600" text-anchor="middle"><tspan x="880" dy="0">更多</tspan></text><circle cx="1382" cy="466" r="38" fill="#C91838" stroke="none" stroke-width="1"/><text x="1382" y="476" font-family="Noto Sans CJK SC, sans-serif" font-size="34" fill="#FFFFFF" font-weight="800" text-anchor="middle"><tspan x="1382" dy="0">↑</tspan></text><text x="800" y="620" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#344054" font-weight="600" text-anchor="middle"><tspan x="800" dy="0">主参数原位快速修改 · 完整参数由“更多”展开 · 图片与 Markdown 资产均可输入</tspan></text><text x="800" y="666" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#667085" font-weight="400" text-anchor="middle"><tspan x="800" dy="0">发送后清空输入，并把文本、图片、参数和有序资产保存为不可变任务快照</tspan></text></svg>