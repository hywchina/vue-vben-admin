<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="report-title report-desc"><title id="report-title">报告生成 · 两条执行路径</title><desc id="report-desc">平台模板渲染与外部 Presenton AI 渲染共用任务和资产入库。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5e6975"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b91c32"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5e6975"/></marker></defs><rect width="1600" height="800" fill="#f4f6f8"/><style>text{font-family:Geist,"Noto Sans CJK SC",sans-serif;fill:#20252c}.sub{fill:#5e6975;font-size:20px}.title{font-family:"Instrument Serif","Noto Serif CJK SC",serif;font-size:36px}.name{font-size:24px;font-weight:600}.small{font-size:16px;fill:#5e6975}</style><text x="48" y="56" class="title">报告生成 · 两条执行路径</text><text x="48" y="96" class="sub">已确认外部服务归属 presenton；助手与 AI 报告共享 rail-vllm 的部署配置</text><path d="M384 264H496" fill="none" stroke="#5e6975" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M816 248H928" fill="none" stroke="#5e6975" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M656 328V448" fill="none" stroke="#5e6975" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M1248 264H1312" fill="none" stroke="#5e6975" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M928 296H880Q872 296 872 304V524Q872 532 864 532H816" fill="none" stroke="#5e6975" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M496 532H384" fill="none" stroke="#5e6975" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="48" y="192" width="336" height="144" rx="8" fill="#ffffff" stroke="#5e6975" stroke-width="1.2"/><text x="72" y="232" class="name">平台报告 API</text><text x="72" y="268" class="sub">校验项目与图片资产</text><text x="72" y="296" class="sub">持久化 jobs + report 执行记录</text><rect x="496" y="192" width="320" height="136" rx="8" fill="#fff0f2" stroke="#b91c32" stroke-width="1.2"/><text x="520" y="232" class="name">Report Worker</text><text x="520" y="268" class="sub">领取租约 / 读取图片</text><text x="520" y="296" class="sub">按 generation_mode 分流</text><rect x="928" y="192" width="320" height="144" rx="8" fill="#ffffff" stroke="#5e6975" stroke-width="1.2"/><text x="952" y="232" class="name">Presenton · AI</text><text x="952" y="268" class="sub">POST /api/v1/generate-file</text><text x="952" y="296" class="sub">接收 multipart 文字与图片</text><rect x="1312" y="192" width="240" height="144" rx="8" fill="#ffffff" stroke="#5e6975" stroke-width="1.2"/><text x="1336" y="232" class="name">rail-vllm</text><text x="1336" y="268" class="sub">Qwen3-VL</text><text x="1336" y="296" class="sub">生成结构化内容</text><rect x="496" y="448" width="320" height="176" rx="8" fill="#ffffff" stroke="#5e6975" stroke-width="1.2"/><text x="520" y="488" class="name">生成文件与校验</text><text x="520" y="524" class="sub">template：平台内置渲染</text><text x="520" y="552" class="sub">ai：接收上游文件字节</text><text x="520" y="580" class="sub">DOCX / PPTX / MD</text><rect x="48" y="448" width="336" height="176" rx="8" fill="#ffffff" stroke="#5e6975" stroke-width="1.2"/><text x="72" y="488" class="name">平台资产入库</text><text x="72" y="524" class="sub">写入 MinIO 私有桶</text><text x="72" y="552" class="sub">事务登记资产与 job_outputs</text><text x="72" y="580" class="sub">成功 / 失败 / 取消留痕</text><text x="952" y="404" class="name">Presenton 内部导出：</text><text x="952" y="444" class="sub">Word / MD：本地渲染</text><text x="952" y="480" class="sub">PPT：本地模板 + Next.js 导出</text><text x="952" y="556" class="small">上游同步请求不提供取消端点</text><path d="M48 676H1552" stroke="#dde2e7"/><text x="48" y="716" class="sub">契约差异：平台最多 24 张图片；Presenton 最多 8 张。AI 报告需对齐上限或设计拆分策略。</text><text x="48" y="756" class="small">取消语义：平台可阻止结果入库，但当前不能保证立即中断 Presenton 内部推理。</text></svg>