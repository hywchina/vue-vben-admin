<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" width="960" height="568" role="img" aria-labelledby="figure-15-title figure-15-desc" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title id="figure-15-title">标记参考图与文本指令的实际编辑链路</title><desc id="figure-15-desc">原图与笔画由EasyMark合成参考图，与编辑指令进入图像编辑模型；输出经人工比较后登记项目资产。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#505050"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#202020"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#505050"/></marker></defs><rect width="960" height="568" fill="white"/><path d="M40 512 H920" stroke="#b8b8b8" stroke-width="1"/><path d="M 264 116 L 368 116" fill="none" stroke="#505050" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 592 116 L 696 116" fill="none" stroke="#505050" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 808 168 L 808 312" fill="none" stroke="#505050" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 696 364 L 592 364" fill="none" stroke="#505050" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 368 364 L 264 364" fill="none" stroke="#505050" stroke-width="1.6" marker-end="url(#arrow)" /><rect x="40" y="64" width="224" height="104" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="152.0" y="108" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">原图与用户标记</text><text x="152.0" y="144" font-size="20" font-weight="400" text-anchor="middle" fill="#202020">原图、笔画分别保存</text><rect x="368" y="64" width="224" height="104" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="480.0" y="108" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">EasyMark 合成</text><text x="480.0" y="144" font-size="20" font-weight="400" text-anchor="middle" fill="#202020">合成带标记的参考图</text><rect x="696" y="64" width="224" height="104" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="808.0" y="108" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">图像预处理</text><text x="808.0" y="144" font-size="20" font-weight="400" text-anchor="middle" fill="#202020">尺寸处理与条件组织</text><rect x="696" y="312" width="224" height="104" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="808.0" y="356" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">FLUX.2 Klein 编辑</text><text x="808.0" y="392" font-size="20" font-weight="400" text-anchor="middle" fill="#202020">参考图与文字指令</text><rect x="368" y="312" width="224" height="104" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="480.0" y="356" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">结果与原图比较</text><text x="480.0" y="392" font-size="20" font-weight="400" text-anchor="middle" fill="#202020">目标、保持及标记残留</text><rect x="40" y="312" width="224" height="104" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="152.0" y="356" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">确认登记成果</text><text x="152.0" y="392" font-size="20" font-weight="400" text-anchor="middle" fill="#202020">保存来源，供后续复用</text><text x="40" y="244" font-size="20" font-weight="400" text-anchor="start" fill="#202020">原图与标记快照用于追溯；模型使用工作流内部合成的参考图。</text><text x="40" y="464" font-size="20" font-weight="400" text-anchor="start" fill="#202020">颜色与编号是人工指代；本链路不输出自动语义分割结果。</text><text x="40" y="544" font-size="20" font-weight="400" text-anchor="start" fill="#202020">流程依据当前工作流连接关系；不是已完成案例或效果试验的证明。</text></svg>