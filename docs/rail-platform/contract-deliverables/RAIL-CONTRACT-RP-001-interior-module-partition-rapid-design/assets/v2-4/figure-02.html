<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平台构建的五层逻辑架构</title><style>*{box-sizing:border-box}body{margin:0;background:white;color:#202020;font-family:Noto Sans CJK SC, Microsoft YaHei, sans-serif}svg{display:block}.frame{width:960px}h1{font-family:"Noto Serif CJK SC",serif;font-size:24px;font-weight:500;margin:24px 40px}@media print{h1{display:none}}</style></head><body><main class="frame"><h1>平台构建的五层逻辑架构</h1><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-labelledby="figure-02-title figure-02-desc" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title id="figure-02-title">平台构建的五层逻辑架构</title><desc id="figure-02-desc">用户、应用、软件支撑、数据和基础五层衔接设计方法与平台建设；星号标明待建设能力，个人助手独立于设计任务。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#505050"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#202020"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#505050"/></marker></defs><rect width="960" height="680" fill="white"/><path d="M40 624 H920" stroke="#b8b8b8" stroke-width="1"/><path d="M 480 128 L 480 148" fill="none" stroke="#505050" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 480 236 L 480 256" fill="none" stroke="#505050" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 480 344 L 480 364" fill="none" stroke="#505050" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 480 452 L 480 472" fill="none" stroke="#505050" stroke-width="1.6" marker-end="url(#arrow)" /><rect x="40" y="40" width="880" height="88" rx="0" fill="#f3f3f3" stroke="#505050" stroke-width="1.2" /><text x="60" y="88" font-size="24" font-weight="500" text-anchor="start" fill="#202020">用户层</text><text x="272" y="76" font-size="24" font-weight="400" text-anchor="start" fill="#202020">设计使用与专业确认｜项目协作｜平台管理</text><text x="272" y="108" font-size="20" font-weight="400" text-anchor="start" fill="#202020">专业复核属于业务职责，不增加账号角色</text><rect x="40" y="148" width="880" height="88" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="60" y="196" font-size="24" font-weight="500" text-anchor="start" fill="#202020">应用层</text><text x="272" y="184" font-size="24" font-weight="400" text-anchor="start" fill="#202020">分区与快速设计｜资产与项目｜训练与报告</text><text x="272" y="216" font-size="20" font-weight="400" text-anchor="start" fill="#202020">候选区域确认*；个人图文助手独立运行</text><rect x="40" y="256" width="880" height="88" rx="0" fill="#f3f3f3" stroke="#505050" stroke-width="1.2" /><text x="60" y="304" font-size="24" font-weight="500" text-anchor="start" fill="#202020">软件支撑层</text><text x="272" y="292" font-size="24" font-weight="400" text-anchor="start" fill="#202020">身份与权限｜任务与版本｜适配器｜审计</text><text x="272" y="324" font-size="20" font-weight="400" text-anchor="start" fill="#202020">设计工作流独立执行，聊天不下发设计任务</text><rect x="40" y="364" width="880" height="88" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="60" y="412" font-size="24" font-weight="500" text-anchor="start" fill="#202020">数据层</text><text x="272" y="400" font-size="24" font-weight="400" text-anchor="start" fill="#202020">原图与标记｜任务与成果｜关系数据与文件</text><text x="272" y="432" font-size="20" font-weight="400" text-anchor="start" fill="#202020">模块属性*｜工程规则*｜区域识别评测资料*</text><rect x="40" y="472" width="880" height="88" rx="0" fill="#f3f3f3" stroke="#505050" stroke-width="1.2" /><text x="60" y="520" font-size="24" font-weight="500" text-anchor="start" fill="#202020">基础层</text><text x="272" y="508" font-size="24" font-weight="400" text-anchor="start" fill="#202020">平台运行环境｜外部计算服务｜网络与存储</text><text x="272" y="540" font-size="20" font-weight="400" text-anchor="start" fill="#202020">容器部署｜受控访问｜备份与恢复</text><text x="40" y="656" font-size="20" font-weight="400" text-anchor="start" fill="#202020">箭头表示职责依赖，不是逐次执行；* 表示研究后建设，不代表已实现。</text></svg></main></body></html>
