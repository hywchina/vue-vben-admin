<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 544" width="960" height="544" role="img" aria-labelledby="figure-08-title figure-08-desc" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title id="figure-08-title">局部修改后的跨区域检查方法</title><desc id="figure-08-desc">以侧墙修改为例，分别检查顶部、座椅及门区的影响后，由设计人员决定是否补充调整。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#505050"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#202020"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#505050"/></marker></defs><rect width="960" height="544" fill="white"/><path d="M40 488 H920" stroke="#b8b8b8" stroke-width="1"/><path d="M 264 248 L 296.0 248.0 Q 304 248 304.0 240.0 L 304.0 116.0 Q 304 108 312.0 108.0 L 376 108" fill="none" stroke="#505050" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 264 304 L 328.0 304.0 Q 336 304 336.0 312.0 L 336.0 420.0 Q 336 428 344.0 428.0 L 376 428" fill="none" stroke="#505050" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 264 268 L 376 268" fill="none" stroke="#505050" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 600 108 L 648.0 108.0 Q 656 108 656.0 116.0 L 656.0 240.0 Q 656 248 664.0 248.0 L 704 248" fill="none" stroke="#505050" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 600 428 L 648.0 428.0 Q 656 428 656.0 420.0 L 656.0 312.0 Q 656 304 664.0 304.0 L 704 304" fill="none" stroke="#505050" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 600 268 L 704 268" fill="none" stroke="#505050" stroke-width="1.6" marker-end="url(#arrow)" /><rect x="40" y="224" width="224" height="104" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="152.0" y="268" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">侧墙局部修改</text><text x="152.0" y="304" font-size="20" font-weight="400" text-anchor="middle" fill="#202020">明确变化与保留条件</text><rect x="376" y="64" width="224" height="88" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="488.0" y="100" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">顶部衔接</text><text x="488.0" y="136" font-size="20" font-weight="400" text-anchor="middle" fill="#202020">边界与视觉过渡</text><rect x="376" y="224" width="224" height="88" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="488.0" y="260" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">座椅背景</text><text x="488.0" y="296" font-size="20" font-weight="400" text-anchor="middle" fill="#202020">形态与色彩关系</text><rect x="376" y="384" width="224" height="88" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="488.0" y="420" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">门区过渡</text><text x="488.0" y="456" font-size="20" font-weight="400" text-anchor="middle" fill="#202020">开口与整体协调</text><rect x="704" y="224" width="216" height="104" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="812.0" y="268" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">合并检查意见</text><text x="812.0" y="304" font-size="20" font-weight="400" text-anchor="middle" fill="#202020">人工判断是否调整</text><text x="40" y="520" font-size="20" font-weight="400" text-anchor="start" fill="#202020">本图为拟采用的专业检查方法，不表示平台已自动建立区域依赖。</text></svg>