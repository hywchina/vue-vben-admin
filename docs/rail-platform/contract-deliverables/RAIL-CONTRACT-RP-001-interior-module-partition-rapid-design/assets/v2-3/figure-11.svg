<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" width="960" height="512" role="img" aria-labelledby="figure-11-title figure-11-desc" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><title id="figure-11-title">设计输入与成果复用的来源关系</title><desc id="figure-11-desc">原图、参数和标记快照关联同一任务，输出经用户确认登记为项目资产，再供后续任务引用。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#505050"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#202020"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#505050"/></marker></defs><rect width="960" height="512" fill="white"/><path d="M40 456 H920" stroke="#b8b8b8" stroke-width="1"/><path d="M 152 136 L 152 192" fill="none" stroke="#505050" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 480 136 L 480 192" fill="none" stroke="#505050" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 808 136 L 808 192" fill="none" stroke="#505050" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 152 264 L 152 344" fill="none" stroke="#505050" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 264 392 L 368 392" fill="none" stroke="#505050" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M 592 392 L 696 392" fill="none" stroke="#505050" stroke-width="1.6" marker-end="url(#arrow)" /><rect x="40" y="40" width="224" height="96" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="152.0" y="80" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">原始输入资产</text><text x="152.0" y="116" font-size="20" font-weight="400" text-anchor="middle" fill="#202020">实际执行底图</text><rect x="368" y="40" width="224" height="96" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="480.0" y="80" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">本轮参数</text><text x="480.0" y="116" font-size="20" font-weight="400" text-anchor="middle" fill="#202020">文字 · 标记 · 配置</text><rect x="696" y="40" width="224" height="96" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="808.0" y="80" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">标记快照</text><text x="808.0" y="116" font-size="20" font-weight="400" text-anchor="middle" fill="#202020">历史显示依据</text><rect x="40" y="192" width="880" height="72" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="480.0" y="220" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">同一设计任务</text><text x="480.0" y="256" font-size="20" font-weight="400" text-anchor="middle" fill="#202020">关联项目、会话、能力版本、输入和参数</text><rect x="40" y="344" width="224" height="96" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="152.0" y="384" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">任务结果</text><text x="152.0" y="420" font-size="20" font-weight="400" text-anchor="middle" fill="#202020">暂存输出</text><rect x="368" y="344" width="224" height="96" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="480.0" y="384" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">项目资产</text><text x="480.0" y="420" font-size="20" font-weight="400" text-anchor="middle" fill="#202020">用户确认后登记</text><rect x="696" y="344" width="224" height="96" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="808.0" y="384" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">后续任务</text><text x="808.0" y="420" font-size="20" font-weight="400" text-anchor="middle" fill="#202020">引用已登记资产</text><text x="40" y="488" font-size="20" font-weight="400" text-anchor="start" fill="#202020">标记快照不能替代原图；保存状态不能替代专业评审结论。</text></svg>