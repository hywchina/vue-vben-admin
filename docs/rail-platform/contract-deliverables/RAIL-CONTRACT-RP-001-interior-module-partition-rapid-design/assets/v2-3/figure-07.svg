middle" fill="#202020">模式 · 标记 · 参数</text><rect x="696" y="72" width="224" height="104" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="808.0" y="116" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">任务执行</text><text x="808.0" y="152" font-size="20" font-weight="400" text-anchor="middle" fill="#202020">固定能力版本</text><rect x="696" y="280" width="224" height="104" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="808.0" y="324" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">结果比较</text><text x="808.0" y="360" font-size="20" font-weight="400" text-anchor="middle" fill="#202020">保留完整输出</text><rect x="368" y="280" width="224" height="104" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="480.0" y="324" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">确认登记资产</text><text x="480.0" y="360" font-size="20" font-weight="400" text-anchor="middle" fill="#202020">用户选择保存</text><rect x="40" y="280" width="224" height="104" rx="0" fill="white" stroke="#505050" stroke-width="1.2" /><text x="152.0" y="324" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">下一轮深化</text><text x="152.0" y="360" font-size="20" font-weight="400" text-anchor="middle" fill="#202020">新任务引用成果</text><text x="40" y="456" font-size="20" font-weight="400" text-anchor="start" fill="#202020">同一会话单任务运行；历史轮次不覆盖，暂存结果不能直接跨能力复用。</text></svg>